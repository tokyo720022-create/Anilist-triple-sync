name: Manual AniList → MAL Manga Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mal-anilist-manga-sync
  cancel-in-progress: false

jobs:
  sync-mal-manga:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run AniList → MAL manga sync
        env:
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_REFRESH_TOKEN: ${{ secrets.MAL_REFRESH_TOKEN }}
        run: python -u mal_manga_sync_engine.py

      - name: Persist manga delta state safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mal_manga_delta_state.json
          git commit -m "Update MAL manga sync state [skip ci]" || echo "No manga state changes to commit"

          git fetch origin main
          git rebase origin/main

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ Manga delta state persisted successfully."
              exit 0
            fi

            echo "⚠️ Push attempt $i failed. Refreshing remote main..."
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done

          echo "❌ Could not persist manga delta state after 3 push attempts."
          exit 1
