name: Anime Overdrive Core

on:
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00, 23:00 IST
    # GitHub Actions cron uses UTC.
    - cron: '30 2,5,8,11,14,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-overdrive-core
  cancel-in-progress: false

jobs:
  run_anime_core:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ---------------------------------------------------------
      # Sync with latest main BEFORE Anime Engine modifies files
      # ---------------------------------------------------------
      - name: Sync Repository Before Engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Syncing local branch with origin/main..."
          git rebase origin/main

          echo "Repository is up to date."

      # ---------------------------------------------------------
      # Run Anime Engine
      # ---------------------------------------------------------
      - name: Detonate Anime Engine
        env:
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}

          DISCORD_ANILIST_ANIME_WEBHOOK: ${{ secrets.DISCORD_ANILIST_ANIME_WEBHOOK }}
          DISCORD_ANILIST_LOG_WEBHOOK: ${{ secrets.DISCORD_ANILIST_LOG_WEBHOOK }}
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
          DISCORD_FAVORITES_WEBHOOK: ${{ secrets.DISCORD_FAVORITES_WEBHOOK }}
          DISCORD_GHOST_RADAR_WEBHOOK: ${{ secrets.DISCORD_GHOST_RADAR_WEBHOOK }}
          DISCORD_ACHIEVEMENTS_WEBHOOK: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK }}
          DISCORD_PERFORMANCE_WEBHOOK: ${{ secrets.DISCORD_PERFORMANCE_WEBHOOK }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ZULIP_SERVER_URL: ${{ secrets.ZULIP_SERVER_URL }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}

        run: |
          python anime_engine.py

      # ---------------------------------------------------------
      # Commit Anime Engine output
      # ---------------------------------------------------------
      - name: Lock Anime Memory to Git Vault
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Checking Anime Engine changes..."
          git status --short

          echo "Staging generated files..."

          git add -- \
            'db_anime_*.json' \
            performance/ \
            README.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo "Changes detected. Creating commit..."

          git commit \
            -m "chore: Anime Telemetry Matrix Sync [skip ci]"

          # ---------------------------------------------------
          # Refresh remote before pushing in case main changed
          # while the engine was running.
          # ---------------------------------------------------
          echo "Checking remote for new commits..."

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Remote main changed while the engine was running."
            echo "Rebasing Anime Engine commit onto latest main..."

            git rebase origin/main
          fi

          echo "Pushing changes to main..."

          git push origin HEAD:main

          echo "Anime Memory successfully locked to Git Vault."