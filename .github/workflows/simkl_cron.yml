name: Simkl Buffer Matrix

on:
  schedule:
    # Set this strictly to your 2 PM and 11 PM UTC equivalent
    - cron: '0 14,23 * * *' 
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Simkl Sync Engine
        env:
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_TOKEN: ${{ secrets.SIMKL_TOKEN }}
          DISCORD_GHOST: ${{ secrets.DISCORD_GHOST }}
        run: python simkl_engine.py

      - name: Commit Cleared Database Buffers
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add db_simkl_buffer.json db_simkl_ghosts.json || true
          git commit -m "Auto-flush Simkl buffers [skip ci]" || true
          git push
          
