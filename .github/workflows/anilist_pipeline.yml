name: Maximum Overdrive V2 Hub

on:
  schedule:
    # Strike 1: 08:00, 11:00, 14:00, 17:00, 20:00, 23:00 IST
    - cron: '30 2,5,8,11,14,17 * * *'

    # Strike 2: 09:30, 12:30, 15:30, 18:30, 21:30 IST
    - cron: '0 4,7,10,13,16 * * *'

  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute_matrix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run V2 Telemetry Engine
        env:
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}

          # Discord
          DISCORD_ANILIST_ANIME_WEBHOOK: ${{ secrets.DISCORD_ANILIST_ANIME_WEBHOOK }}
          DISCORD_ANILIST_MANGA_WEBHOOK: ${{ secrets.DISCORD_ANILIST_MANGA_WEBHOOK }}
          DISCORD_ANILIST_LOG_WEBHOOK: ${{ secrets.DISCORD_ANILIST_LOG_WEBHOOK }}

          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
          DISCORD_FAVORITES_WEBHOOK: ${{ secrets.DISCORD_FAVORITES_WEBHOOK }}
          DISCORD_GHOST_RADAR_WEBHOOK: ${{ secrets.DISCORD_GHOST_RADAR_WEBHOOK }}
          DISCORD_ACHIEVEMENTS_WEBHOOK: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK }}
          DISCORD_PERFORMANCE_WEBHOOK: ${{ secrets.DISCORD_PERFORMANCE_WEBHOOK }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Zulip
          ZULIP_SERVER_URL: ${{ secrets.ZULIP_SERVER_URL }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}

        run: |
          python -u anilist_engine.py

      - name: Show Engine Status
        if: always()
        run: |
          echo "=== Maximum Overdrive V2 workflow finished ==="
          echo "Anime webhook configured: ${{ secrets.DISCORD_ANILIST_ANIME_WEBHOOK != '' }}"
          echo "Manga webhook configured: ${{ secrets.DISCORD_ANILIST_MANGA_WEBHOOK != '' }}"

      - name: Lock Memory to Git Vault
        if: success()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git pull origin main --rebase || true

          # Persist JSON databases, performance telemetry and README
          git add '*.json' performance/ README.md || true

          if ! git diff --staged --quiet; then
            git commit -m "chore: V2 Matrix Telemetry Sync [skip ci]"
            git push
          else
            echo "No database or telemetry changes to commit."
          fi
          
