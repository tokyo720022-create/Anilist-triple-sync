name: Manual AniList → MAL Sync

on:
  workflow_dispatch:  # Manual trigger for precise control

permissions:
  contents: write     # Essential: Grants the authority to push changes back to the repository

jobs:
  sync-mal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Pulls the full history to guarantee a clean, conflict-free rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Locked to 3.12 to match the optimal runner environment

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run AniList → MAL sync
        run: python mal_sync_engine.py
        env:
          # If your Python engine requires API keys to fetch the tracker data, map them here:
          # ANILIST_TOKEN: ${{ secrets.ANILIST_TOKEN }}
          # MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}

      - name: Persist delta state safely
        run: |
          # 1. Lock in the new state data first
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update MAL sync state [skip ci]" || echo "No changes to commit"

          # 2. Sync with remote and execute the push
          for i in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            sleep 2
          done
          
          echo "❌ Could not persist delta state after 3 push attempts."
          exit 1
