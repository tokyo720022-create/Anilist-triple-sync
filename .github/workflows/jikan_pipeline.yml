name: Jikan Dossier Pipeline

on:
  workflow_dispatch: # ⚡ Strictly manual detonation only

permissions:
  contents: write

jobs:
  extract_dossiers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Dossier Engine
        env:
          # ⚡ Now wired directly to your brand new secret
          DISCORD_DOSSIER_WEBHOOK: ${{ secrets.DISCORD_DOSSIER_WEBHOOK }} 
        run: python jikan_dossier.py

      - name: Save Dossier Memory
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull origin main --rebase || true 
          git add db_dossiers.json || true 
          git diff --staged --quiet || git commit -m "chore: Log processed Jikan dossiers [skip ci]"
          git push
