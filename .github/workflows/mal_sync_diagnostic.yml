name: 🔍 Full MAL Sync Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full static diagnostic
        shell: python
        run: |
          import ast
          import json
          import re
          import sys
          from pathlib import Path

          ENGINE = Path("mal_sync_engine.py")
          WORKFLOW = Path(".github/workflows/mal_sync_manual.yml")
          STATE = Path("mal_delta_state.json")

          errors = []
          warnings = []
          passed = []

          def ok(msg):
              passed.append(msg)
              print(f"✅ {msg}")

          def warn(msg):
              warnings.append(msg)
              print(f"⚠️ {msg}")

          def err(msg):
              errors.append(msg)
              print(f"❌ {msg}")

          print("=" * 72)
          print("FULL MAL SYNC DIAGNOSTIC")
          print("=" * 72)
          print(f"Engine   : {ENGINE}")
          print(f"Workflow : {WORKFLOW}")
          print(f"State    : {STATE}")
          print()

          # --------------------------------------------------
          # Repository/files
          # --------------------------------------------------
          if ENGINE.exists():
              ok("mal_sync_engine.py exists")
          else:
              err("mal_sync_engine.py is missing")

          if WORKFLOW.exists():
              ok("mal_sync_manual.yml exists")
          else:
              err("mal_sync_manual.yml is missing")

          # --------------------------------------------------
          # Python syntax / AST
          # --------------------------------------------------
          tree = None
          if ENGINE.exists():
              source = ENGINE.read_text(encoding="utf-8")

              try:
                  tree = ast.parse(source, filename=str(ENGINE))
                  ok("Engine Python syntax is valid")
              except SyntaxError as exc:
                  err(
                      f"Engine syntax error: line {exc.lineno}, "
                      f"column {exc.offset}: {exc.msg}"
                  )
                  source = ""

              if tree:
                  defs = {
                      n.name for n in ast.walk(tree)
                      if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))
                  }

                  calls = {
                      n.func.id for n in ast.walk(tree)
                      if isinstance(n, ast.Call) and isinstance(n.func, ast.Name)
                  }

                  required = [
                      "load_state",
                      "save_state",
                      "require_config",
                      "request_with_retry",
                      "refresh_mal_token",
                      "fetch_anilist_delta",
                      "fetch_mal_entry",
                      "sync_entry",
                      "main",
                  ]

                  for name in required:
                      if name in defs:
                          ok(f"Function exists: {name}()")
                      else:
                          err(f"Required function missing: {name}()")

                  for name in sorted(
                      c for c in calls
                      if c.startswith((
                          "fetch_", "save_", "load_",
                          "sync_", "refresh_", "require_"
                      ))
                  ):
                      if name not in defs:
                          err(f"Undefined local function call: {name}()")

                  for module in ("os", "json", "time", "requests"):
                      if re.search(
                          rf"(?m)^(?:import\s+{module}\b|from\s+{module}\b)",
                          source
                      ):
                          ok(f"Import present: {module}")
                      else:
                          err(f"Required import missing: {module}")

                  # ------------------------------------------------
                  # AniList delta logic
                  # ------------------------------------------------
                  if "updatedAt" in source:
                      ok("AniList query requests updatedAt")
                  else:
                      err("AniList query does not request updatedAt")

                  if "UPDATED_TIME_DESC" in source:
                      ok("AniList query is newest-first")
                  else:
                      warn("AniList query is not explicitly newest-first")

                  if "mal_delta_state.json" in source:
                      ok("Persistent delta state is referenced")
                  else:
                      err("Persistent delta state is missing")

                  if "last_anilist_update" in source:
                      ok("Global AniList cursor exists")
                  else:
                      warn("Global AniList cursor is missing")

                  if "media_updates" in source:
                      ok("Per-media update state exists")
                  else:
                      warn("Per-media update state is missing")

                  # ------------------------------------------------
                  # MAL API design
                  # ------------------------------------------------
                  if "@me/animelist" in source:
                      err(
                          "Full MAL library endpoint detected. "
                          "This defeats short/delta MAL lookups."
                      )
                  else:
                      ok("No full MAL library scan endpoint detected")

                  if "/v2/anime/{anime_id}" in source:
                      ok("Targeted MAL anime lookup endpoint detected")
                  else:
                      err("Targeted MAL anime lookup endpoint missing")

                  if "my_list_status" in source:
                      ok("MAL my_list_status lookup detected")
                  else:
                      err("MAL my_list_status lookup missing")

                  if "my_list_status" in source and "PUT" in source:
                      ok("MAL list update path detected")
                  else:
                      warn("Could not verify MAL write-back method")

                  # ------------------------------------------------
                  # Secrets
                  # ------------------------------------------------
                  for secret in (
                      "ANILIST_TARGET_TOKEN",
                      "MAL_CLIENT_ID",
                      "MAL_CLIENT_SECRET",
                      "MAL_REFRESH_TOKEN",
                  ):
                      if secret in source:
                          ok(f"Engine references {secret}")
                      else:
                          err(f"Engine does not reference {secret}")

                  # ------------------------------------------------
                  # Status/score/date mappings
                  # ------------------------------------------------
                  for status in (
                      "CURRENT", "REPEATING", "PLANNING",
                      "COMPLETED", "PAUSED", "DROPPED"
                  ):
                      if status in source:
                          ok(f"Status mapping includes {status}")
                      else:
                          warn(f"Status mapping does not include {status}")

                  if '"num_watched_episodes"' in source:
                      ok("Watched episode update field exists")
                  else:
                      err("Watched episode update field missing")

                  if "start_date" in source and "finish_date" in source:
                      ok("Start/finish date handling detected")
                  else:
                      warn("Start/finish date handling incomplete")

                  if "score <= 0" in source and "return None" in source:
                      warn(
                          "Score=0 appears to be treated as no score. "
                          "This may prevent clearing an existing MAL rating."
                      )

                  if "REPEATING" in source and "is_rewatching" not in source:
                      warn(
                          "AniList REPEATING does not appear to map "
                          "to MAL rewatch state."
                      )

                  # ------------------------------------------------
                  # Failure/state safety
                  # ------------------------------------------------
                  if "successful_media_ids" in source:
                      ok("Per-entry success tracking detected")
                  else:
                      warn(
                          "No per-entry success tracking detected; "
                          "failed entries may advance the cursor."
                      )

                  if "PermissionError" in source and "refresh_mal_token()" in source:
                      ok("401/token refresh retry path detected")
                  else:
                      warn("Token refresh retry path could not be verified")

                  if "new_refresh_token" in source:
                      ok("Refresh-token rotation is detected")
                  else:
                      err("Refresh-token rotation handling is missing")

                  if "os.replace" in source:
                      ok("State writes use atomic replacement")
                  else:
                      warn("Atomic state-file replacement not detected")

                  # ------------------------------------------------
                  # Deletion / edge cases
                  # ------------------------------------------------
                  if not any(
                      s in source.lower()
                      for s in (
                          "deleted", "removed",
                          "missing_from_anilist",
                          "not_in_anilist"
                      )
                  ):
                      warn(
                          "No AniList deletion/removal handling detected. "
                          "Removing an entry from AniList may not remove it from MAL."
                      )

                  if "fingerprint" not in source:
                      warn(
                          "No content fingerprint detected; equal-timestamp "
                          "edge cases may exist."
                      )

                  # Make sure this engine doesn't write back to AniList.
                  if "SaveMediaListEntry" in source:
                      err(
                          "SaveMediaListEntry detected. "
                          "This MAL-only engine should not write to AniList."
                      )
                  else:
                      ok("No AniList SaveMediaListEntry mutation detected")

          # --------------------------------------------------
          # Workflow
          # --------------------------------------------------
          if WORKFLOW.exists():
              wf = WORKFLOW.read_text(encoding="utf-8")

              if re.search(r"(?m)^\s*workflow_dispatch\s*:\s*$", wf):
                  ok("Workflow is manual-only via workflow_dispatch")
              else:
                  err("workflow_dispatch trigger not found")

              unwanted = []
              for trigger in ("push", "pull_request", "schedule", "workflow_run"):
                  if re.search(rf"(?m)^\s*{trigger}\s*:", wf):
                      unwanted.append(trigger)

              if unwanted:
                  warn("Automatic triggers also found: " + ", ".join(unwanted))
              else:
                  ok("No push/pull_request/schedule/workflow_run trigger found")

              if re.search(r"(?m)^\s*contents:\s*write\s*$", wf):
                  ok("Workflow has contents: write")
              else:
                  err("Workflow lacks contents: write")

              if "fetch-depth: 0" in wf:
                  ok("Workflow uses fetch-depth: 0")
              else:
                  warn("Workflow does not use fetch-depth: 0")

              if "git fetch origin main" in wf:
                  ok("Workflow fetches origin/main before persistence")
              else:
                  err("Workflow does not fetch origin/main")

              if "git rebase origin/main" in wf:
                  ok("Workflow has rebase protection")
              else:
                  warn("Workflow does not rebase before push")

              if "git push" in wf:
                  ok("Workflow pushes persistent state")
              else:
                  err("Workflow does not push persistent state")

              if "mal_delta_state.json" in wf:
                  ok("Workflow persists mal_delta_state.json")
              else:
                  err("Workflow does not persist mal_delta_state.json")

              if "concurrency:" in wf:
                  ok("Workflow has concurrency protection")
              else:
                  warn("No concurrency group detected")

              if "MAL_CLIENT_ID" in wf and "MAL_CLIENT_SECRET" in wf:
                  ok("MAL OAuth secrets are passed to the engine")
              else:
                  err("MAL OAuth secrets are not fully passed")

              if "ANILIST_TARGET_TOKEN" in wf:
                  ok("AniList token is passed to the engine")
              else:
                  err("AniList token is not passed to the engine")

              if "python mal_sync_engine.py" in wf:
                  ok("Workflow runs mal_sync_engine.py")
              else:
                  err("Workflow does not run mal_sync_engine.py")

              if re.search(r"git\s+commit\b", wf):
                  ok("Workflow commits delta state")
              else:
                  err("Workflow does not commit delta state")

          # --------------------------------------------------
          # Existing state file
          # --------------------------------------------------
          if STATE.exists():
              try:
                  state_data = json.loads(STATE.read_text(encoding="utf-8"))
                  if isinstance(state_data, dict):
                      ok("Existing mal_delta_state.json is valid JSON")
                      if "last_anilist_update" in state_data:
                          ok("State contains last_anilist_update")
                      if "media_updates" in state_data:
                          count = len(state_data["media_updates"]) if isinstance(
                              state_data["media_updates"], dict
                          ) else 0
                          ok(f"State contains {count} per-media records")
                  else:
                      err("State file root is not a JSON object")
              except Exception as exc:
                  err(f"State file is invalid JSON: {exc}")
          else:
              print("ℹ️ No local state file in checkout; this is normal if the workflow has not committed one yet.")

          print()
          print("=" * 72)
          print("DIAGNOSTIC SUMMARY")
          print("=" * 72)
          print(f"✅ PASS   : {len(passed)}")
          print(f"⚠️ WARN   : {len(warnings)}")
          print(f"❌ ERROR  : {len(errors)}")

          if errors:
              print("\n❌ RESULT: FIX REQUIRED")
              sys.exit(1)

          if warnings:
              print("\n⚠️ RESULT: NO HARD ERRORS, BUT WARNINGS EXIST")
              sys.exit(0)

          print("\n✅ RESULT: STATIC DIAGNOSTIC PASSED")
          sys.exit(0)
