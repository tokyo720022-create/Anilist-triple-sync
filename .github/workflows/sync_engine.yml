name: Triple Sync Engine

on:
  schedule:
    - cron: '30 3,7,11,17 * * *' 
  workflow_dispatch:

jobs:
  sync_all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run AniList Sync
        env:
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}
          DISCORD_ANILIST_WEBHOOK: ${{ secrets.DISCORD_ANILIST_WEBHOOK }}
          DISCORD_ANILIST_LOG_WEBHOOK: ${{ secrets.DISCORD_ANILIST_LOG_WEBHOOK }}
          ANILIST_ERROR_REPORT_WEBHOOK: ${{ secrets.ANILIST_ERROR_REPORT_WEBHOOK }}
        run: python anilist_sync.py

      - name: Run MAL 1 Sync
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_1_REFRESH_TOKEN: ${{ secrets.MAL_1_REFRESH_TOKEN }}
          DISCORD_MAL1_WEBHOOK: ${{ secrets.DISCORD_MAL1_WEBHOOK }}
          DISCORD_MAL_LOG_WEBHOOK: ${{ secrets.DISCORD_MAL_LOG_WEBHOOK }}
          MAL_ERROR_REPORT: ${{ secrets.MAL_ERROR_REPORT }}
        run: python mal_1_sync.py

      - name: Run MAL 2 Sync
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          MAL_CLIENT_SECRET: ${{ secrets.MAL_CLIENT_SECRET }}
          MAL_2_REFRESH_TOKEN: ${{ secrets.MAL_2_REFRESH_TOKEN }}
          DISCORD_MAL2_WEBHOOK: ${{ secrets.DISCORD_MAL2_WEBHOOK }}
          DISCORD_MAL_LOG_WEBHOOK: ${{ secrets.DISCORD_MAL_LOG_WEBHOOK }}
          MAL_ERROR_REPORT: ${{ secrets.MAL_ERROR_REPORT }}
        run: python mal_2_sync.py

      - name: Save Engine Memory
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.json
          git commit -m "chore: update tokens, sync times, and thread map [skip ci]" || echo "No changes to commit"
          git push
          
