name: Maximum Overdrive V2 - Manga Engine

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # These run at 10:00, 11:30, 13:00, 14:30, 16:00,
    # 17:30, 19:00, 20:30 and 22:00 IST.
    # No Manga engine runs from 22:00 IST until 10:00 IST.
    - cron: '30 4 * * *'
    - cron: '0 6 * * *'
    - cron: '30 7 * * *'
    - cron: '0 9 * * *'
    - cron: '30 10 * * *'
    - cron: '0 12 * * *'
    - cron: '30 13 * * *'
    - cron: '0 15 * * *'
    - cron: '30 16 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maximum-overdrive-v2-manga
  cancel-in-progress: false

jobs:
  manga_engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ---------------------------------------------------------
      # Sync repository BEFORE manga_engine.py modifies files
      # ---------------------------------------------------------
      - name: Sync Repository Before Engine
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Rebasing local branch onto latest main..."
          git rebase origin/main

          echo "Repository is up to date."

      # ---------------------------------------------------------
      # Run Manga Engine
      # ---------------------------------------------------------
      - name: Run Manga Engine
        env:
          # AniList
          ANILIST_TARGET_TOKEN: ${{ secrets.ANILIST_TARGET_TOKEN }}

          # Discord
          DISCORD_ANILIST_MANGA_WEBHOOK: ${{ secrets.DISCORD_ANILIST_MANGA_WEBHOOK }}
          DISCORD_ANILIST_LOG_WEBHOOK: ${{ secrets.DISCORD_ANILIST_LOG_WEBHOOK }}
          DISCORD_AIRING_WEBHOOK: ${{ secrets.DISCORD_AIRING_WEBHOOK }}
          DISCORD_FAVORITES_WEBHOOK: ${{ secrets.DISCORD_FAVORITES_WEBHOOK }}
          DISCORD_GHOST_RADAR_WEBHOOK: ${{ secrets.DISCORD_GHOST_RADAR_WEBHOOK }}
          DISCORD_ACHIEVEMENTS_WEBHOOK: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK }}
          DISCORD_PERFORMANCE_WEBHOOK: ${{ secrets.DISCORD_PERFORMANCE_WEBHOOK }}

          # Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Zulip
          ZULIP_SERVER_URL: ${{ secrets.ZULIP_SERVER_URL }}
          ZULIP_BOT_EMAIL: ${{ secrets.ZULIP_BOT_EMAIL }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}

        run: |
          python -u manga_engine.py

      # ---------------------------------------------------------
      # Commit Manga Engine output
      # ---------------------------------------------------------
      - name: Lock Memory to Git Vault
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Checking Manga Engine changes..."
          git status --short

          echo "Staging Manga databases and telemetry..."

          git add -- \
            '*.json' \
            performance/ \
            README.md

          if git diff --cached --quiet; then
            echo "No Manga database or telemetry changes to commit."
            exit 0
          fi

          echo "Changes detected. Creating commit..."

          git commit \
            -m "chore: Manga Engine Telemetry Sync [skip ci]"

          # -----------------------------------------------------
          # Make sure main did not change while engine was running
          # -----------------------------------------------------
          echo "Fetching latest remote main..."

          git fetch origin main

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Remote main changed while Manga Engine was running."
            echo "Rebasing Manga Engine commit onto latest main..."

            git rebase origin/main
          fi

          echo "Pushing Manga Engine changes..."

          git push origin HEAD:main

          echo "Manga memory successfully locked to Git Vault."